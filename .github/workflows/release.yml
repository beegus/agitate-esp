name: Release

# Builds the 3DS client on every change to 3ds/. Pushing a tag such as `v1.1.0`
# also builds the firmware and publishes a GitHub release with both attached.
on:
  push:
    branches: [main]
    paths: ["3ds/**", ".github/workflows/release.yml"]
    tags: ["v*"]
  workflow_dispatch:

env:
  # v0.19.0+ needs glibc 2.38, newer than the devkitPro image provides.
  MAKEROM_URL: https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip
  MAKEROM_SHA256: dd596854718c195c6e3229286be485b122921715555af8ae5cf8e9a465d9f970
  BANNERTOOL_URL: https://github.com/diasurgical/bannertool/releases/download/1.2.0/bannertool.zip
  BANNERTOOL_SHA256: 69768596f836acb3e3aeaa66e47c6ba560dde813c6dfcd33c8afc25fe29b7524
  ESPTOOL_VERSION: "5.4.0"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - id: pick
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="0.0.0"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag must look like v1.2.3"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  firmware:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v')
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Both pio commands must see the same flags, or the second one cleans the build.
      PLATFORMIO_BUILD_FLAGS: -DAGITATE_ESP_VERSION=\"${{ needs.version.outputs.version }}\"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO and esptool
        run: pip install platformio "esptool==$ESPTOOL_VERSION"

      - name: Build firmware and LittleFS image
        run: |
          pio run -e esp32-c3-supermini
          pio run -e esp32-c3-supermini -t buildfs

      - name: Package images
        shell: bash
        run: |
          build=.pio/build/esp32-c3-supermini
          fs_offset=$(python3 - "$build/partitions.bin" <<'EOF'
          import struct, sys
          table = open(sys.argv[1], "rb").read()
          for i in range(0, len(table), 32):
              magic, ptype, subtype, offset, _ = struct.unpack_from("<HBBII", table, i)
              if magic == 0x50AA and ptype == 1 and subtype == 0x82:
                  print(hex(offset))
                  break
          EOF
          )
          [[ -n "$fs_offset" ]] || { echo "No LittleFS partition found"; exit 1; }
          mkdir dist
          esptool --chip esp32c3 merge-bin -o "dist/agitate-esp-$VERSION-full.bin" \
            0x0 "$build/firmware.factory.bin" "$fs_offset" "$build/littlefs.bin"
          cp "$build/firmware.bin" "dist/agitate-esp-$VERSION-firmware.bin"
          cp "$build/littlefs.bin" "dist/agitate-esp-$VERSION-littlefs.bin"

      # LGPL libraries are statically linked, so their exact source ships with
      # the binaries alongside the project source needed to rebuild and relink.
      - name: Bundle corresponding source
        shell: bash
        run: |
          root="agitate-esp-$VERSION"
          third_party="$root/third_party"
          mkdir -p "$third_party/arduino-esp32"
          git archive --format=tar HEAD | tar -x -C "$root"
          for lib in ESPAsyncWebServer AsyncTCP ArduinoJson; do
            cp -R ".pio/libdeps/esp32-c3-supermini/$lib" "$third_party/"
          done
          framework="$HOME/.platformio/packages/framework-arduinoespressif32"
          framework_version=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['version'])" "$framework/package.json")
          cp -R "$framework/cores" "$framework/libraries" "$framework/variants" "$framework/package.json" \
            "$third_party/arduino-esp32/"
          curl -fsSL -o "$third_party/arduino-esp32/LICENSE.md" \
            "https://raw.githubusercontent.com/espressif/arduino-esp32/$framework_version/LICENSE.md"
          tar -czf "dist/$root-source.tar.gz" "$root"

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/*
          if-no-files-found: error

  client-3ds:
    needs: version
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20260610
    steps:
      - uses: actions/checkout@v4

      - name: Install build helpers
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 unzip curl ca-certificates make

      - name: Install makerom and bannertool
        run: |
          mkdir -p /tmp/tools /usr/local/bin
          cd /tmp/tools
          curl -fsSL -o makerom.zip "$MAKEROM_URL"
          curl -fsSL -o bannertool.zip "$BANNERTOOL_URL"
          echo "$MAKEROM_SHA256  makerom.zip" | sha256sum -c -
          echo "$BANNERTOOL_SHA256  bannertool.zip" | sha256sum -c -
          unzip -q makerom.zip -d makerom
          unzip -q bannertool.zip -d bannertool
          install -m 755 makerom/makerom /usr/local/bin/makerom
          install -m 755 bannertool/linux-x86_64/bannertool /usr/local/bin/bannertool

      - name: Host tests
        run: make -C 3ds test

      - name: Build CIA and 3DSX
        run: |
          export PATH="$DEVKITPRO/tools/bin:$PATH"
          make -C 3ds VERSION=${{ needs.version.outputs.version }} cia 3dsx

      - uses: actions/upload-artifact@v4
        with:
          name: client-3ds
          path: |
            3ds/AgitateESP3DS.cia
            3ds/AgitateESP3DS.3dsx
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, firmware, client-3ds]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          ## ESP32-C3 firmware

          - **agitate-esp-$VERSION-full.bin**: complete image for a new board. Flash at \`0x0\`, for example with
            \`esptool --chip esp32c3 write-flash 0x0 agitate-esp-$VERSION-full.bin\` or a browser flasher such as
            https://espressif.github.io/esptool-js/. This erases saved Wi-Fi settings and the access point password.
          - **agitate-esp-$VERSION-firmware.bin** (\`0x10000\`) and **agitate-esp-$VERSION-littlefs.bin**
            (\`0x290000\`): update an existing board and keep its settings.
          - **agitate-esp-$VERSION-source.tar.gz**: project source plus the exact source of the libraries built into
            the firmware.

          ## Nintendo 3DS app

          Requires a 3DS that can already run homebrew.

          - **AgitateESP3DS.cia**: install with a CIA installer such as FBI; it then appears on the HOME Menu.
          - **AgitateESP3DS.3dsx**: copy to \`/3ds/\` on the SD card and launch from the Homebrew Launcher.

          \`LICENSE\`, \`THIRD_PARTY_NOTICES.md\`, and the GPL/LGPL texts cover the project and the third-party code
          in these builds.
          Read the [safety and liability notice](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/README.md#safety-and-liability)
          before building or using the device.
          EOF
          gh release create "${{ github.ref_name }}" dist/* LICENSE THIRD_PARTY_NOTICES.md licenses/*.txt \
            --repo "${{ github.repository }}" \
            --title "agitate-esp ${{ github.ref_name }}" \
            --notes-file notes.md
