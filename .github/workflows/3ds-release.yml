name: 3DS app

# Builds the 3DS client on every change to 3ds/. Pushing a tag such as
# `3ds-v1.1.0` also publishes a GitHub release with the .cia and .3dsx attached.
on:
  push:
    branches: [main]
    paths: ["3ds/**", ".github/workflows/3ds-release.yml"]
    tags: ["3ds-v*"]
  workflow_dispatch:

env:
  # v0.19.0+ needs glibc 2.38, newer than the devkitPro image provides.
  MAKEROM_URL: https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip
  MAKEROM_SHA256: dd596854718c195c6e3229286be485b122921715555af8ae5cf8e9a465d9f970
  BANNERTOOL_URL: https://github.com/diasurgical/bannertool/releases/download/1.2.0/bannertool.zip
  BANNERTOOL_SHA256: 69768596f836acb3e3aeaa66e47c6ba560dde813c6dfcd33c8afc25fe29b7524

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20260610
    steps:
      - uses: actions/checkout@v4

      - name: Install build helpers
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 unzip curl ca-certificates make

      - name: Install makerom and bannertool
        run: |
          mkdir -p /tmp/tools /usr/local/bin
          cd /tmp/tools
          curl -fsSL -o makerom.zip "$MAKEROM_URL"
          curl -fsSL -o bannertool.zip "$BANNERTOOL_URL"
          echo "$MAKEROM_SHA256  makerom.zip" | sha256sum -c -
          echo "$BANNERTOOL_SHA256  bannertool.zip" | sha256sum -c -
          unzip -q makerom.zip -d makerom
          unzip -q bannertool.zip -d bannertool
          install -m 755 makerom/makerom /usr/local/bin/makerom
          install -m 755 bannertool/linux-x86_64/bannertool /usr/local/bin/bannertool

      - name: Pick version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/3ds-v* ]]; then
            version="${GITHUB_REF#refs/tags/3ds-v}"
          else
            version="0.0.0"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag must look like 3ds-v1.2.3"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Host tests
        run: make -C 3ds test

      - name: Build CIA and 3DSX
        run: |
          export PATH="$DEVKITPRO/tools/bin:$PATH"
          make -C 3ds VERSION=${{ steps.version.outputs.version }} cia 3dsx

      - uses: actions/upload-artifact@v4
        with:
          name: agitate-esp-3ds
          path: |
            3ds/AgitateESP3DS.cia
            3ds/AgitateESP3DS.3dsx
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/3ds-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: agitate-esp-3ds
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          Nintendo 3DS client for agitate-esp. Requires a 3DS that can already run homebrew.

          - **AgitateESP3DS.cia**: install with a CIA installer such as FBI; it then appears on the HOME Menu.
          - **AgitateESP3DS.3dsx**: copy to `/3ds/` on the SD card and launch from the Homebrew Launcher.

          `LICENSE` and `THIRD_PARTY_NOTICES.md` cover the app and the libraries built into it.

          See [3ds/README.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/3ds/README.md) for setup and controls.
          EOF
          gh release create "${{ github.ref_name }}" AgitateESP3DS.cia AgitateESP3DS.3dsx \
            LICENSE THIRD_PARTY_NOTICES.md \
            --repo "${{ github.repository }}" \
            --title "3DS app ${GITHUB_REF_NAME#3ds-}" \
            --notes-file notes.md
