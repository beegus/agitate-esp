name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio
      - name: Host tests (Workflow, StepperAgitator)
        run: pio test -e native
      - name: Build firmware
        run: pio run -e esp32-c3-supermini
      - name: Build LittleFS image
        run: pio run -e esp32-c3-supermini -t buildfs

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dev server tests
        run: python3 -m unittest discover -s tests

  client-3ds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JSON, model, and discovery tests
        run: make -C 3ds test
