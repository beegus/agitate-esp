[platformio]
default_envs = esp32-c3-supermini
test_dir = tests

[env:esp32-c3-supermini]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
; The C3 SuperMini has no USB-UART bridge, so Serial has to go over native USB CDC.
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
monitor_filters = esp32_exception_decoder
lib_deps =
  ESP32Async/ESPAsyncWebServer @ 3.12.1
  ESP32Async/AsyncTCP @ 3.5.0
  bblanchon/ArduinoJson @ 7.4.3

[env:native]
platform = native
test_framework = unity
test_build_src = yes
test_filter = test_native
build_src_filter =
  +<Workflow.cpp>
  +<StepperAgitator.cpp>
build_flags =
  -I tests/native/fakes
